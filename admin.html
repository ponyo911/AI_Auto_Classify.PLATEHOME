<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 페이지 | PLATE & HOME</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/common.css" />
    <style>
        .admin-wrap {
            max-width: 1200px;
            margin: 100px auto 80px;
            padding: 0 24px;
        }

        .admin-title {
            font-size: 28px;
            font-weight: 700;
            border-bottom: 2px solid #111;
            padding-bottom: 16px;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 40px;
        }

        th,
        td {
            border-bottom: 1px solid #e5e5e5;
            padding: 10px 12px;
            text-align: center;
            font-size: 14px;
        }

        th {
            background: #f9f9f9;
            font-weight: 700;
            color: #333;
        }

        .status-select {
            padding: 6px 10px;
            border: 1px solid #ccc;
            font-size: 13px;
            border-radius: 4px;
        }

        .tab-btn {
            font-size: 18px;
            font-weight: 700;
            border: none;
            background: none;
            cursor: pointer;
            padding-bottom: 8px;
            color: #888;
        }

        .tab-btn.active {
            color: #111;
            border-bottom: 2px solid #111;
        }
    </style>
</head>

<body>
    <header class="header">
        <div class="inner header-inner">
            <a href="./index.html" class="logo">PLATE &amp; HOME <span
                    style="color:red; font-size:14px;">(ADMIN)</span></a>
        </div>
    </header>

    <main class="admin-wrap">
        <div style="display: flex; gap: 20px; margin-bottom: 30px;">
            <button onclick="switchTab('order')" id="tabOrder" class="tab-btn active">주문 관리</button>
            <button onclick="switchTab('product')" id="tabProduct" class="tab-btn">상품 관리</button>
            <button onclick="switchTab('user')" id="tabUser" class="tab-btn">회원 관리</button>
        </div>
        <section id="sectionOrder">
            <h2 class="admin-title">전체 주문 현황</h2>
            <table>
                <thead>
                    <tr>
                        <th>주문번호</th>
                        <th>주문자명</th>
                        <th>총 결제금액</th>
                        <th>주문 일시</th>
                        <th>주문 상태 관리</th>
                    </tr>
                </thead>
                <tbody id="adminOrderList"></tbody>
            </table>
        </section>

        <section id="sectionProduct" style="display: none;">
            <div style="margin-bottom: 30px; padding: 24px; border: 1px solid #e5e5e5; background: #fafafa;">
                <h3 style="font-size: 16px; font-weight: 700; margin-bottom: 16px;">신규 상품 등록</h3>

                <!-- AI 자동 분류 영역 -->
                <div
                    style="border: 2px dashed #ccc; border-radius: 8px; padding: 20px; margin-bottom: 20px; background: #fff;">
                    <p style="font-size: 14px; font-weight: 700; margin-bottom: 12px;">🤖 AI 이미지 자동 분류</p>
                    <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
                        <input type="file" id="productImageFile" accept="image/*" onchange="onImageSelected(this)"
                            style="font-size: 13px;">
                        <img id="imagePreview" src="" alt="미리보기"
                            style="width:80px; height:80px; object-fit:cover; border:1px solid #ddd; border-radius:4px; display:none;">
                        <button id="analyzeBtn" onclick="analyzeImage()" disabled
                            style="background:#4a90d9; color:#fff; padding:10px 20px; font-size:13px; font-weight:700; border:none; cursor:pointer; border-radius:4px;">
                            AI 분석
                        </button>
                        <span id="analyzeStatus" style="font-size:13px; color:#666;">이미지를 선택하면 AI가 자동으로 분석합니다.</span>
                    </div>
                </div>

                <!-- 입력 폼 -->
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px;">
                    <input type="text" id="newProductName" placeholder="상품명"
                        style="height: 40px; border: 1px solid #ccc; padding: 0 12px; font-size: 14px;">
                    <input type="number" id="newProductPrice" placeholder="가격 (숫자만)"
                        style="height: 40px; border: 1px solid #ccc; padding: 0 12px; font-size: 14px;">
                    <input type="text" id="newProductImage" placeholder="이미지 경로 (예: img/NEW1.jpg)"
                        style="height: 40px; border: 1px solid #ccc; padding: 0 12px; font-size: 14px;">
                    <select id="newProductCategory"
                        style="height: 40px; border: 1px solid #ccc; padding: 0 12px; font-size: 14px;">
                        <option value="featured">Best Items</option>
                        <option value="new">New</option>
                        <option value="collection">Collection</option>
                        <option value="mug">Mug</option>
                        <option value="plate">Plate</option>
                        <option value="tableware">Tableware</option>
                    </select>
                </div>
                <button onclick="addProduct()"
                    style="background: #111; color: #fff; padding: 10px 28px; font-size: 14px; font-weight: 700; border: none; cursor: pointer;">등록</button>
            </div>
            <h2 class="admin-title">등록된 상품 목록</h2>
            <div style="margin-bottom: 16px; display:flex; gap:8px;">
                <input type="text" id="productSearch" placeholder="상품명으로 검색"
                    onkeydown="if(event.key==='Enter') searchProducts()"
                    style="height:40px; border:1px solid #ccc; padding:0 12px; font-size:14px; width:300px;">
                <button onclick="searchProducts()"
                    style="height:40px; padding:0 20px; background:#111; color:#fff; border:none; cursor:pointer; font-size:14px;">검색</button>
                <button onclick="resetSearch()"
                    style="height:40px; padding:0 20px; background:#fff; color:#111; border:1px solid #ccc; cursor:pointer; font-size:14px;">초기화</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th style="width:60px;">번호</th>
                        <th style="width:120px;">이미지</th>
                        <th>상품명</th>
                        <th style="width:120px;">카테고리</th>
                        <th style="width:150px;">가격</th>
                        <th style="width:130px;">관리</th>
                    </tr>
                </thead>
                <tbody id="adminProductList"></tbody>
            </table>
            <div id="productPaging" style="text-align:center; margin: 20px 0;"></div>
        </section>
        <section id="sectionUser" style="display: none;">
            <h2 class="admin-title">회원 목록</h2>
            <table>
                <thead>
                    <tr>
                        <th>이름</th>
                        <th>이메일</th>
                        <th>가입일</th>
                        <th>권한</th>
                        <th>관리</th>
                    </tr>
                </thead>
                <tbody id="adminUserList"></tbody>
            </table>
        </section>
    </main>

    <script>
        function onImageSelected(input) {
            const file = input.files[0];
            if (!file) return;
            const preview = document.getElementById("imagePreview");
            preview.src = URL.createObjectURL(file);
            preview.style.display = "block";
            document.getElementById("analyzeBtn").disabled = false;
            document.getElementById("analyzeStatus").textContent = "AI 분석 버튼을 클릭하세요.";
        }

        async function analyzeImage() {
            const fileInput = document.getElementById("productImageFile");
            const file = fileInput.files[0];
            if (!file) return;

            const btn = document.getElementById("analyzeBtn");
            const status = document.getElementById("analyzeStatus");
            btn.disabled = true;
            status.textContent = "⏳ AI가 이미지를 분석 중입니다...";

            const formData = new FormData();
            formData.append("file", file);

            try {
                const response = await fetch("/api/analyze-image", {
                    method: "POST",
                    body: formData
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.detail || "분석 실패");

                document.getElementById("newProductName").value = result.name || "";
                document.getElementById("newProductPrice").value = result.price || "";
                document.getElementById("newProductImage").value = result.image || "";
                document.getElementById("newProductCategory").value = result.category || "featured";

                status.textContent = "✅ 분석 완료! 내용 확인 후 등록하세요.";
                btn.disabled = false;
            } catch (error) {
                status.textContent = `❌ 오류: ${error.message}`;
                btn.disabled = false;
            }
        }
        // 주문 목록 로드
        async function fetchAdminOrders() {
            const container = document.getElementById("adminOrderList");
            try {
                const response = await fetch("/api/orders");
                const data = await response.json();
                if (!data.orders || data.orders.length === 0) {
                    container.innerHTML = `<tr><td colspan="5" style="padding: 40px; color:#888;">접수된 주문이 없습니다.</td></tr>`;
                    return;
                }
                let html = "";
                data.orders.forEach(order => {
                    const status = order.status || '결제완료';
                    let badgeColor = '#444';
                    if (status === '상품준비중') badgeColor = '#f39c12';
                    if (status === '배송중') badgeColor = '#3498db';
                    if (status === '배송완료') badgeColor = '#27ae60';

                    html += `<tr>
                        <td><strong>${order.id}</strong></td>
                        <td>${order.customer_name}</td>
                        <td>${order.total_amount.toLocaleString()}원</td>
                        <td>${new Date(order.created_at).toLocaleString("ko-KR")}</td>
                        <td>
                            <span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:${badgeColor}; margin-right:8px;"></span>
                            <select class="status-select" onchange="updateOrderStatus(${order.id}, this.value)" style="border-color:${badgeColor}">
                                <option value="결제완료" ${status === '결제완료' ? 'selected' : ''}>결제완료</option>
                                <option value="상품준비중" ${status === '상품준비중' ? 'selected' : ''}>상품준비중</option>
                                <option value="배송중" ${status === '배송중' ? 'selected' : ''}>배송중</option>
                                <option value="배송완료" ${status === '배송완료' ? 'selected' : ''}>배송완료</option>
                            </select>
                        </td>
                    </tr>`;
                });
                container.innerHTML = html;
            } catch (e) { console.error(e); }
        }

        async function addProduct() {
            const name = document.getElementById("newProductName").value.trim();
            const price = document.getElementById("newProductPrice").value.trim();
            const image = document.getElementById("newProductImage").value.trim();
            const category = document.getElementById("newProductCategory").value;

            if (!name || !price || !image) {
                alert("상품명, 가격, 이미지 경로를 모두 입력해주세요.");
                return;
            }

            const response = await fetch("/api/products", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    name,
                    price: parseInt(price),
                    image,
                    category,
                    badge: "NEW",
                    discount: 0,
                    oldPrice: parseInt(price)
                })
            });

            const result = await response.json();
            if (response.ok) {
                alert("상품이 등록되었습니다.");
                document.getElementById("newProductName").value = "";
                document.getElementById("newProductPrice").value = "";
                document.getElementById("newProductImage").value = "";
                fetchAdminProducts();
            } else {
                alert("등록 실패: " + result.detail);
            }
        }

        let currentPage = 1;
        const PAGE_SIZE = 6;
        let allProducts = [];
        let filteredProducts = [];

        async function fetchAdminProducts() {
            const container = document.getElementById("adminProductList");
            try {
                const response = await fetch("/api/products");
                const products = await response.json();
                if (!products || products.length === 0) {
                    container.innerHTML = `<tr><td colspan="6" style="padding:40px; color:#888;">등록된 상품이 없습니다.</td></tr>`;
                    return;
                }
                allProducts = products.sort((a, b) => {
                    if (a.registered_at && b.registered_at) return new Date(b.registered_at) - new Date(a.registered_at);
                    if (a.registered_at) return -1;
                    if (b.registered_at) return 1;
                    return 0;
                });
                filteredProducts = [...allProducts];
                currentPage = 1;
                renderProductPage();
            } catch (e) { console.error(e); }
        }

        function searchProducts() {
            const keyword = document.getElementById("productSearch").value.trim().toLowerCase();
            filteredProducts = keyword
                ? allProducts.filter(p => p.name.toLowerCase().includes(keyword))
                : [...allProducts];
            currentPage = 1;
            renderProductPage();
        }

        function resetSearch() {
            document.getElementById("productSearch").value = "";
            filteredProducts = [...allProducts];
            currentPage = 1;
            renderProductPage();
        }

        function renderProductPage() {
            const container = document.getElementById("adminProductList");
            const totalPages = Math.ceil(filteredProducts.length / PAGE_SIZE);
            const start = (currentPage - 1) * PAGE_SIZE;
            const pageItems = filteredProducts.slice(start, start + PAGE_SIZE);

            if (pageItems.length === 0) {
                container.innerHTML = `<tr><td colspan="6" style="padding:40px; color:#888;">검색 결과가 없습니다.</td></tr>`;
                document.getElementById("productPaging").innerHTML = "";
                return;
            }

            let html = "";
            pageItems.forEach((p, index) => {
                const rowNum = filteredProducts.length - start - index;
                html += `<tr id="row-${p.id}">
            <td style="color:#888; font-size:13px;">${rowNum}</td>
            <td style="text-align:center; vertical-align:middle; padding-left:20px;">
                <img src="${p.image}" alt="${p.name}"
                    style="width:100px; height:100px; object-fit:cover; border:1px solid #eee; border-radius:4px;"
                    onerror="this.style.background='#f5f5f5'; this.src=''">
            </td>
            <td id="name-${p.id}" style="text-align:center;">${p.name}</td>
            <td id="cat-${p.id}" style="text-align:center; vertical-align:middle;">${getCategoryDisplay(p.id)}</td>
            <td id="price-${p.id}">${p.price.toLocaleString()}원</td>
            <td id="btn-${p.id}">
                <div style="display:flex; gap:6px; justify-content:center; align-items:center;">
                    <button onclick="editProduct('${p.id}', '${p.name.replace(/'/g, "\\'")}', ${p.price}, '${p.category || "featured"}')"
                        style="color:#4a90d9; border:1px solid #4a90d9; background:#fff; cursor:pointer; padding:2px 8px;">수정</button>
                    <button onclick="deleteProduct('${p.id}')"
                        style="color:red; border:1px solid red; background:#fff; cursor:pointer; padding:2px 8px;">삭제</button>
                </div>
            </td>
        </tr>`;
            });
            container.innerHTML = html;

            const paging = document.getElementById("productPaging");
            let pagingHtml = "";
            for (let i = 1; i <= totalPages; i++) {
                pagingHtml += `<button onclick="goProductPage(${i})"
            style="margin:0 3px; padding:6px 12px; border:1px solid #ccc;
            background:${i === currentPage ? '#111' : '#fff'};
            color:${i === currentPage ? '#fff' : '#333'};
            cursor:pointer; font-size:13px;">${i}</button>`;
            }
            paging.innerHTML = pagingHtml;
        }

        function goProductPage(page) {
            currentPage = page;
            renderProductPage();
        }

        function editProduct(id, name, price, category) {
            const nameCell = document.getElementById(`name-${id}`);
            const priceCell = document.getElementById(`price-${id}`);
            const catCell = document.getElementById(`cat-${id}`);

            nameCell.innerHTML = `<input type="text" id="edit-name-${id}" value="${name}"
        style="width:100%; height:32px; border:1px solid #4a90d9; padding:0 8px; font-size:14px;">`;

            priceCell.innerHTML = `<input type="number" id="edit-price-${id}" value="${price}"
        style="width:100px; height:32px; border:1px solid #4a90d9; padding:0 8px; font-size:14px;">`;

            catCell.innerHTML = `<select id="edit-cat-${id}"
        style="height:32px; border:1px solid #4a90d9; padding:0 4px; font-size:13px;">
        <option value="featured" ${category === 'featured' ? 'selected' : ''}>Best Items</option>
        <option value="new" ${category === 'new' ? 'selected' : ''}>New</option>
        <option value="collection" ${category === 'collection' ? 'selected' : ''}>Collection</option>
        <option value="mug" ${category === 'mug' ? 'selected' : ''}>Mug</option>
        <option value="plate" ${category === 'plate' ? 'selected' : ''}>Plate</option>
        <option value="tableware" ${category === 'tableware' ? 'selected' : ''}>Tableware</option>
    </select>`;

            const btnCell = document.getElementById(`btn-${id}`);
            btnCell.innerHTML = `
        <div style="display:flex; gap:6px; justify-content:center; align-items:center;">
            <button onclick="saveProduct('${id}')"
                style="color:#fff; border:none; background:#4a90d9; cursor:pointer; padding:2px 8px;">저장</button>
            <button onclick="fetchAdminProducts()"
                style="color:#888; border:1px solid #ccc; background:#fff; cursor:pointer; padding:2px 8px;">취소</button>
        </div>`;
        }

        async function saveProduct(id) {
            const name = document.getElementById(`edit-name-${id}`).value.trim();
            const price = document.getElementById(`edit-price-${id}`).value;
            const category = document.getElementById(`edit-cat-${id}`).value;

            if (!name || isNaN(price)) {
                alert("올바른 값을 입력해주세요.");
                return;
            }

            const res = await fetch(`/api/products/${id}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name, price: parseInt(price), category })
            });
            const result = await res.json();
            alert(result.message || "수정되었습니다.");
            fetchAdminProducts();
        }

        // 주문 상태 업데이트
        async function updateOrderStatus(id, status) {
            await fetch(`/api/orders/${id}/status`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ status })
            });
            fetchAdminOrders();
        }

        // 상품 삭제
        async function deleteProduct(id) {
            if (!confirm("삭제하시겠습니까?")) return;
            await fetch(`/api/products/${id}`, { method: "DELETE" });
            fetchAdminProducts();
        }

        // 탭 전환
        function switchTab(type) {
            document.getElementById('sectionOrder').style.display = type === 'order' ? 'block' : 'none';
            document.getElementById('sectionProduct').style.display = type === 'product' ? 'block' : 'none';
            document.getElementById('sectionUser').style.display = type === 'user' ? 'block' : 'none';
            document.getElementById('tabOrder').className = type === 'order' ? 'tab-btn active' : 'tab-btn';
            document.getElementById('tabProduct').className = type === 'product' ? 'tab-btn active' : 'tab-btn';
            document.getElementById('tabUser').className = type === 'user' ? 'tab-btn active' : 'tab-btn';
            if (type === 'order') fetchAdminOrders();
            if (type === 'product') fetchAdminProducts();
            if (type === 'user') fetchAdminUsers();
        }

        async function fetchAdminUsers() {
            const container = document.getElementById("adminUserList");
            try {
                const response = await fetch("/api/users");
                const data = await response.json();
                if (!data.users || data.users.length === 0) {
                    container.innerHTML = `<tr><td colspan="5" style="padding:40px; color:#888;">회원이 없습니다.</td></tr>`;
                    return;
                }
                let html = "";
                data.users.forEach(user => {
                    const isAdmin = user.role === 'admin';
                    html += `<tr>
                <td><strong>${user.user_name}</strong></td>
                <td>${user.email || user.user_id}</td>
                <td>${new Date(user.created_at).toLocaleString("ko-KR")}</td>
                <td>
                    <span style="display:inline-block; padding:2px 10px; border-radius:99px; font-size:12px; font-weight:700;
                        background:${isAdmin ? '#e74c3c' : '#f0f0f0'}; color:${isAdmin ? '#fff' : '#555'};">
                        ${isAdmin ? '관리자' : '일반회원'}
                    </span>
                </td>
                <td style="text-align:center; vertical-align:middle;">
                    <div style="display:flex; gap:6px; justify-content:center; align-items:center; min-height:28px;">
                        ${!isAdmin ? `
                            <button onclick="updateUserRole('${user.user_id}', 'admin')"
                                style="color:#e74c3c; border:1px solid #e74c3c; background:#fff; cursor:pointer; padding:2px 8px; font-size:12px; border-radius:3px;">
                                관리자 승격
                            </button>
                            <button onclick="deleteUser('${user.user_id}')"
                                style="color:#888; border:1px solid #ccc; background:#fff; cursor:pointer; padding:2px 8px; font-size:12px; border-radius:3px;">
                                삭제
                            </button>
                        ` : `<span style="font-size:12px; color:#aaa; display:flex; align-items:center; justify-content:center; width:100%; min-height:28px;">-</span>`}
                    </div>
                </td>
            </tr>`;
                });
                container.innerHTML = html;
            } catch (e) {
                console.error(e);
            }
        }

        async function updateUserRole(userId, role) {
            if (!confirm(`해당 회원을 관리자로 승격하시겠습니까?`)) return;
            await fetch(`/api/users/${userId}/role`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ role })
            });
            fetchAdminUsers();
        }

        async function deleteUser(userId) {
            if (!confirm("해당 회원을 삭제하시겠습니까?")) return;
            await fetch(`/api/users/${userId}`, { method: "DELETE" });
            fetchAdminUsers();
        }

        document.addEventListener("DOMContentLoaded", () => {
            const userRole = localStorage.getItem("userRole");
            if (userRole !== "admin") {
                alert("권한이 없습니다.");
                window.location.href = "/index.html";
                return;
            }
            fetchAdminOrders();
        });

        function getCategoryDisplay(id) {
            const map = {
                'featured': 'Best Items',
                'new': 'New',
                'collection': 'Collection',
                'mug': 'Mug',
                'plate': 'Plate',
                'tableware': 'Tableware'
            };
            const prefix = id.split('-')[0];
            return map[prefix] || '-';
        }
    </script>
    <script src="./js/header.js"></script>
</body>

</html>
